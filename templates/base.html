{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Alvea
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>


<body>
    <div class="scroll-progress">
        <div class="scroll-progress-bar"></div>
    </div>
    <!-- =====================================================
         NAVBAR
    ====================================================== -->
    <div class="scroll-progress">
        <div class="scroll-progress-bar"></div>
    </div>
    <nav class="navbar">

        <a href="/" class="logo">
            ALV<span>É</span>A
        </a>

        <div class="nav-links">

            <a href="/products/">
                Shop
            </a>

            <a href="/#collections">
                Collections
            </a>

            <a href="/#about">
                About
            </a>

        </div>


        <div class="nav-actions">

            <a href="/login" class="login-link">
                Log In
            </a>

            <a href="#" class="cart-link" aria-label="Shopping cart">
                <svg
                    class="cart-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M3 4H5L7.2 15.2C7.4 16.2 8.3 17 9.3 17H17.5C18.5 17 19.3 16.3 19.6 15.4L21 8H6"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                    <circle
                        cx="9.5"
                        cy="20"
                        r="1.2"
                        fill="currentColor"
                    />
                    <circle
                        cx="17.5"
                        cy="20"
                        r="1.2"
                        fill="currentColor"
                    />
                </svg>
            </a>

        </div>

    </nav>

    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <div class="footer-logo">
            ALV<span>É</span>A
        </div>


        <div class="footer-links">

            <a href="#">
                Privacy
            </a>

            <a href="#">
                Terms
            </a>

            <a href="#">
                Contact
            </a>

        </div>


        <p>
            © 2026 Alvea. All rights reserved.
        </p>

    </footer>
    <script src="{% static 'js/scroll-progress.js' %}"></script>
</body>

</html>

{% extends "base.html" %}

{% block title %}
ALVEA | Login
{% endblock %}

{% block content %}

<section class="login-page">

    <div class="login-container">

        <span class="login-eyebrow">
            Welcome to ALVEA
        </span>

        <h1>
            Welcome<br>
            <span>back.</span>
        </h1>

        <p class="login-description">
            Sign in to your account to continue shopping with ALVEA.
        </p>

        <form class="login-form">

            <div class="login-field">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                >
            </div>

            <div class="login-field">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                >
            </div>

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <p class="login-register">
            Don't have an account?
            <a href="#">Register</a>
        </p>

    </div>

</section>

{% endblock %}
